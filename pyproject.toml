[project]
name = "dual-ai"
version = "0.1.0"
description = "Orquestrador local que faz Claude Code e Codex CLI colaborarem em uma tarefa, sem transporte manual."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
dualai = "dualai.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dualai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
